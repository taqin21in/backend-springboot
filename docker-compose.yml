services:
  postgres:
    image: postgres:16-alpine
    container_name: sewa_mobil_postgres
    environment:
      POSTGRES_DB: sewa_mobil_db
      POSTGRES_USER: db_sewa
      POSTGRES_PASSWORD: Password123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db_sewa -d sewa_mobil_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: host.docker.internal:8082/docker-hosted/backend-springboot:1.0
    container_name: sewa_mobil_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sewa_mobil_db
      SPRING_DATASOURCE_USERNAME: db_sewa
      SPRING_DATASOURCE_PASSWORD: Password123!
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8080,http://127.0.0.1:8080
    ports:
      - "8080:8080"

volumes:
  postgres_data:

networks:
  backend-network:
