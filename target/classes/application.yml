server:
  port: 8080

spring:
  application:
    name: sewa-mobil-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://192.168.0.104:5432/sewa_mobil_db}
    username: ${SPRING_DATASOURCE_USERNAME:db_sewa}
    password: ${SPRING_DATASOURCE_PASSWORD:Password123!}
    driver-class-name: org.postgresql.Driver
  hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  cors:
    #allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://192.168.0.104:3000,http://192.168.0.104:5173,http://192.168.0.104:8080,http://127.0.0.1:8080}
